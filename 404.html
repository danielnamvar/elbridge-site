<style>
  /* Self-hosted, like the main site: a webfont arriving from a CDN after
     first paint swaps the type and shifts the layout. */
  @font-face{font-family:'Montserrat';src:url("/img/fonts/montserrat-latin-400-normal.woff2") format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Montserrat';src:url("/img/fonts/montserrat-latin-500-normal.woff2") format('woff2');font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'Figtree';src:url("/img/fonts/figtree-latin-400-normal.woff2") format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Figtree';src:url("/img/fonts/figtree-latin-700-normal.woff2") format('woff2');font-weight:700;font-style:normal;font-display:swap}

  :root{ --forest:#0B0B0C; --teal:#2F7FAE; --teal-lt:#A9CFE8; --pale:#C9CED3; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--forest); color:#fff;
    font-family:'Figtree',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 16px; line-height:1.5;
  }
  /* Same lockup as the site's navigation bar: the mark inherits the
     wordmark's colour so the two are always one colour. */
  .brand{
    font-family:'Montserrat',sans-serif; font-weight:400; font-size:1.0625rem;
    letter-spacing:.09em; text-transform:uppercase; color:#fff; text-decoration:none;
    margin-bottom:48px; display:inline-flex; align-items:center; gap:6px;
  }
  .brand-mark{ width:23px; height:21px; flex:0 0 auto; display:block }
  .brand-mark polygon{ fill:currentColor }
  .code{
    font-family:'Montserrat',sans-serif; font-weight:500; font-size:.75rem; letter-spacing:.22em;
    text-transform:uppercase; color:var(--teal-lt); margin:0 0 18px;
  }
  h1{
    font-size:clamp(1.75rem,5vw,2.5rem); font-weight:700; letter-spacing:-.02em;
    margin:0 0 16px; max-width:18ch;
  }
  p{ color:var(--pale); margin:0 0 36px; max-width:46ch; font-size:1.0625rem }
  .links{ display:flex; flex-wrap:wrap; gap:10px 28px; justify-content:center }
  .links a{ color:var(--teal-lt); text-decoration:none; font-size:.9375rem; border-bottom:1px solid transparent; padding-bottom:2px }
  .links a:hover,.links a:focus-visible{ color:#fff; border-bottom-color:currentColor }
</style>
</head>
<body>

  <h1>This page doesn&rsquo;t exist.</h1>
